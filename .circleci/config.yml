version: 2.1

executors:
  rust-executor:
    docker:
      - image: cimg/rust:1.97.0
    resource_class: medium

jobs:
  test:
    executor: rust-executor
    steps:
      - checkout
      - restore_cache:
          keys:
            - v1-cargo-cache-{{ checksum "Cargo.lock" }}
            - v1-cargo-cache-
      - run:
          name: Check Formatting
          command: cargo fmt --all -- --check
      - run:
          name: Clippy Linter
          command: cargo clippy --all --all-targets -- -D warnings
      - run:
          name: Run Tests
          command: cargo test --all --verbose
      - save_cache:
          key: v1-cargo-cache-{{ checksum "Cargo.lock" }}
          paths:
            - ~/.cargo
            - target

workflows:
  version: 2
  build-and-test:
    jobs:
      - test:
          filters:
            branches:
              ignore:
                - gh-pages
