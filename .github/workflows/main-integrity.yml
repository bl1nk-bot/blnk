name: Main integrity

on:
  pull_request_target:
    types: [opened, reopened, edited, synchronize, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  require-main-base:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    steps:
      - name: Refuse a non-main merge destination
        run: |
          test "${{ github.event.pull_request.base.ref }}" = "main" || {
            echo "Every delivery PR must target main; current base is ${{ github.event.pull_request.base.ref }}."
            exit 1
          }
