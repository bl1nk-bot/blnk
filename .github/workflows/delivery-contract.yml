name: Delivery contract

on:
  pull_request_target:
    types: [opened, reopened, edited, synchronize, ready_for_review]

permissions:
  contents: read
  issues: read
  pull-requests: read

jobs:
  verify:
    name: Issue, documentation, review, and release metadata contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Validate release metadata
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin ${{ github.event.pull_request.base.ref }}
          base_ref="origin/${{ github.event.pull_request.base.ref }}"
          base_version="$(git show "$base_ref:Cargo.toml" | sed -n 's/^version = "\([^"]*\)"/\1/p' | head -n1)"
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n1)"
          node -e '
            const parse = value => {
              const parts = value.split(".").map(Number);
              if (parts.length !== 3 || parts.some(part => !Number.isSafeInteger(part) || part < 0)) process.exit(1);
              return parts;
            };
            const [major, minor, patch] = parse(process.argv[1]);
            const [nextMajor, nextMinor, nextPatch] = parse(process.argv[2]);
            const valid =
              (nextMajor === major && nextMinor === minor && nextPatch === patch + 1) ||
              (nextMajor === major && nextMinor === minor + 1 && nextPatch === 0) ||
              (nextMajor === major + 1 && nextMinor === 0 && nextPatch === 0);
            if (!valid) process.exit(1);
          ' "$base_version" "$version" || { echo "expected the next patch, minor, or major semantic version after $base_version; got $version"; exit 1; }
          git diff --exit-code "$base_ref" -- Cargo.lock >/dev/null && { echo 'Cargo.lock must be updated with Cargo.toml'; exit 1; }
          grep -Fq "## [$version] — PR #${{ github.event.pull_request.number }}" CHANGELOG.md || { echo "CHANGELOG.md needs heading for PR #${{ github.event.pull_request.number }} and $version"; exit 1; }

      - name: Enforce delivery lifecycle evidence
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const body = pr.body || '';
            const failures = [];
            if (pr.base.ref !== 'main') failures.push(`PR base must be main, got ${pr.base.ref}.`);
            if (!/(?:close[sd]?|fix(?:e[sd])?|resolve[sd]?)\s*#\d+/i.test(body)) {
              failures.push('PR body must link its delivery issue with Closes #<number>.');
            }
            for (const item of [
              'Base branch คือ `main`',
              'PR body มี `Closes #<issue>`',
              'อัปเดต canonical docs/status',
              '`Cargo.toml` เพิ่ม semantic version ถัดไปหนึ่งครั้ง และ `Cargo.lock` สอดคล้องกัน',
              'เพิ่มหัวข้อ `## [x.y.z] — PR #...`',
              'รัน verification ที่เกี่ยวข้อง',
              'อ่าน review comments ทั้งหมดแล้ว',
            ]) {
              const escaped = item.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
              if (!new RegExp(`- \\[x\\] ${escaped}`, 'i').test(body)) failures.push(`Unchecked required checklist item: ${item}`);
            }
            const docs = body.match(/## Documentation decision\s*\n+([\s\S]*?)(?=\n## |$)/i)?.[1]?.trim();
            if (!docs || docs.startsWith('<!--')) failures.push('Documentation decision must name updated canonical docs or a specific N/A reason.');
            const query = `query($owner:String!, $repo:String!, $number:Int!) {
              repository(owner:$owner, name:$repo) {
                pullRequest(number:$number) { reviewThreads(first:100) { nodes { isResolved path line comments(first:1) { nodes { body } } } } }
              }
            }`;
            const result = await github.graphql(query, { owner: context.repo.owner, repo: context.repo.repo, number: pr.number });
            const unresolved = result.repository.pullRequest.reviewThreads.nodes.filter(t => !t.isResolved);
            if (unresolved.length) failures.push(`${unresolved.length} unresolved review thread(s) remain.`);
            if (failures.length) core.setFailed(failures.join('\n'));
