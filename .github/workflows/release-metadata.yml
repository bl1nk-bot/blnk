name: Release metadata

on:
  pull_request:
    branches: [main]
    types: [opened, reopened, synchronize, edited, ready_for_review]

permissions:
  contents: read

jobs:
  one-patch-per-pr:
    name: Require one patch version and changelog entry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate metadata produced by the release helper
        shell: pwsh
        run: |
          $baseRef = "origin/${{ github.event.pull_request.base.ref }}"
          $baseCargoToml = git show "$baseRef`:Cargo.toml"
          $baseVersion = ([regex]::Match(($baseCargoToml -join "`n"), '(?m)^version = "(?<version>\d+\.\d+\.\d+)"')).Groups['version'].Value
          if (-not $baseVersion) { throw "Could not read the package version from $baseRef." }
          ./scripts/prepare_release_metadata.ps1 -PrNumber ${{ github.event.pull_request.number }} -BaseVersion $baseVersion -Validate
