name: Release on merge

on:
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: main-releases
  cancel-in-progress: false

jobs:
  tag-and-publish:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
      - id: release
        name: Create immutable tag and GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -n1)"
          tag="v$version"
          if gh release view "$tag" --repo "$REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists; refusing to overwrite it."
            exit 1
          fi
          notes=$(cat <<EOF
          ## PR #$PR_NUMBER — $PR_TITLE

          Source commit: \`$MERGE_SHA\`

          This release was created automatically after the PR was merged into \`main\`.
          EOF
          )
          gh release create "$tag" --repo "$REPOSITORY" --target "$MERGE_SHA" --title "$tag" --notes "$notes"
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

  build-release-assets:
    needs: tag-and-publish
    uses: ./.github/workflows/release.yml
    with:
      tag: v${{ needs.tag-and-publish.outputs.version }}
