name: CI

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "proto/**"
      - "build.rs"
      - "Cargo.toml"
      - "Cargo.lock"
      - "tests/**"
      - "benches/**"
      - "crates/**"
      - ".github/workflows/**"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "src/**"
      - "proto/**"
      - "build.rs"
      - "Cargo.toml"
      - "Cargo.lock"
      - "tests/**"
      - "benches/**"
      - "crates/**"
      - ".github/workflows/**"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  fmt:
    name: Format
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          components: clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: clippy-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: clippy-${{ runner.os }}-
      - run: cargo clippy --all --all-targets -- -D warnings

  test:
    name: Test (Linux)
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: test-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: test-${{ runner.os }}-
      - run: cargo test --all --verbose

  windows:
    name: Check and test (Windows)
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          targets: x86_64-pc-windows-msvc
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: windows-${{ runner.os }}-
      - name: Check for Windows
        run: cargo check --workspace --all-targets --target x86_64-pc-windows-msvc --locked
      - name: Test on Windows
        run: cargo test --workspace --all-targets --target x86_64-pc-windows-msvc --locked --verbose

  android:
    name: Compile (Android)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: android-actions/setup-android@v3.2.2
        with:
          # setup-android defaults to the obsolete SDK package "tools".
          packages: ''
      - name: Install Android NDK and clang toolchain
        shell: bash
        run: |
          set -euo pipefail
          sdkmanager --sdk_root="$ANDROID_HOME" \
            "platform-tools" \
            "platforms;android-35" \
            "ndk;27.2.12479018"
      - uses: dtolnay/rust-toolchain@1.97.0
        with:
          targets: aarch64-linux-android
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: android-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: android-${{ runner.os }}-
      - name: Compile for Android
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.2.12479018"
          export CC_aarch64_linux_android="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android35-clang"
          export AR_aarch64_linux_android="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar"
          cargo check --target aarch64-linux-android --all-targets

  security:
    name: Security Audit
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ignore: RUSTSEC-2023-0071
