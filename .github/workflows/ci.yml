name: CI

on:
  push:
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    paths:
      - "src/**"
      - "crates/**"
      - "proto/**"
      - "build.rs"
      - "Cargo.toml"
      - "Cargo.lock"
      - "tests/**"
      - "benches/**"
      - ".github/workflows/**"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "src/**"
      - "crates/**"
      - "proto/**"
      - "build.rs"
      - "Cargo.toml"
      - "Cargo.lock"
      - "tests/**"
      - "benches/**"
      - ".github/workflows/**"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fmt:
    name: Format
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: clippy-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: clippy-${{ runner.os }}-
      - run: cargo clippy --all --all-targets -- -D warnings

  test:
    name: Test (Linux)
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: test-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: test-${{ runner.os }}-
      - run: cargo test --all --verbose

  windows:
    name: Check and test (Windows)
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: windows-${{ runner.os }}-
      - name: Check for Windows
        run: cargo check --workspace --all-targets --target x86_64-pc-windows-msvc --locked
      - name: Test on Windows
        run: cargo test --workspace --all-targets --target x86_64-pc-windows-msvc --locked --verbose

  android:
    name: Compile (Android)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: android-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: android-${{ runner.os }}-
      - name: Compile for Android
        run: |
          set -euo pipefail
          cargo check --target aarch64-linux-android --lib --locked

  security:
    name: Security Audit
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          ignore: RUSTSEC-2023-0071
