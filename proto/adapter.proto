syntax = "proto3";
package blnk.adapter;

import "object_model.proto";
import "storage.proto";

message AdapterCapabilities {
  bool can_detect = 1;
  bool can_import = 2;
  bool can_preview = 3;
  bool can_apply = 4;
  bool can_rollback = 5;
  repeated string supported_kinds = 6;
  repeated string supported_fields = 7;
}
message AdapterRecord {
  string id = 1;
  string display_name = 2;
  string version = 3;
  string detected_path = 4;
  AdapterCapabilities capabilities = 5;
  string status = 6;
}
message DetectionResult {
  string adapter_id = 1;
  bool detected = 2;
  string path = 3;
  string version = 4;
  string reason = 5;
}
message ImportContext {
  string adapter_id = 1;
  bool include_secrets = 2;
  string workspace_id = 3;
}
message ImportSnapshot {
  string adapter_id = 1;
  repeated blnk.object.ObjectRecord objects = 2;
  string source_hash = 3;
  repeated string warnings = 4;
}
message ApplyPlan {
  string object_id = 1;
  uint64 revision = 2;
  string adapter_id = 3;
  repeated blnk.storage.ApplyReceipt changes = 4;
  repeated string warnings = 5;
  bool requires_confirmation = 6;
}
message ApplyRequest {
  ApplyPlan plan = 1;
  bool confirmed = 2;
}
message ApplyResponse { blnk.storage.ApplyReceipt receipt = 1; }
message RollbackRequest { string receipt_id = 1; }
message RollbackResponse { bool rolled_back = 1; string error_code = 2; }
