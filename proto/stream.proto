syntax = "proto3";

package stream;

// ============================================================================
// Stream Types
// ============================================================================

enum StreamType {
  STREAM_TYPE_UNSPECIFIED = 0;
  STREAM_TYPE_HTTP = 1;        // HTTP request/response
  STREAM_TYPE_FILE = 2;        // File transfer
  STREAM_TYPE_TCP = 3;         // Raw TCP forwarding
  STREAM_TYPE_WEBSOCKET = 4;   // WebSocket bridging
  STREAM_TYPE_SHELL = 5;       // Interactive shell
}

// ============================================================================
// HTTP Stream Messages
// ============================================================================

// HTTP request metadata (SYN frame payload)
message HTTPRequest {
  string type = 1;            // "http" (optional, defaults to "http")
  string method = 2;          // HTTP method (GET, POST, etc.)
  string pathname = 3;        // Request path
  string content_type = 4;   // Content-Type header
  int64 content_length = 5;   // Content-Length in bytes
  map<string, string> headers = 6;  // Request headers
}

// HTTP response metadata (SYN frame payload)
message HTTPResponse {
  int32 status = 1;           // HTTP status code
  map<string, string> headers = 2;  // Response headers
}

// HTTP data chunk (DAT frame payload)
message HTTPData {
  bytes data = 1;             // Chunk of request/response body
}

// ============================================================================
// File Stream Messages
// ============================================================================

// File operation type
enum FileOpType {
  FILE_OP_UNSPECIFIED = 0;
  FILE_OP_GET = 1;           // Download file
  FILE_OP_PUT = 2;           // Upload file
  FILE_OP_LIST = 3;          // List directory
  FILE_OP_STAT = 4;          // Get file stats
  FILE_OP_DELETE = 5;        // Delete file
}

// File operation request (SYN frame payload)
message FileOp {
  string type = 1;            // "file"
  FileOpType op = 2;          // Operation type
  string path = 3;           // File path
  int64 size = 4;            // For PUT: total bytes to send
  bool overwrite = 5;        // For PUT: allow overwrite
  repeated int64 range = 6;  // For GET: byte range [start, end]
  uint64 request_id = 7;      // Correlates a response with its active request
  string checksum = 8;        // For PUT: expected SHA-256 in lowercase hex
}

// File metadata
message FileInfo {
  string name = 1;           // File name
  int64 size = 2;            // File size in bytes
  bool is_dir = 3;           // Is directory
  string modified = 4;       // Last modified timestamp
  string mode = 5;          // File permissions
  uint64 request_id = 6;     // Request that produced this metadata
}

// File list response
message FileList {
  string path = 1;           // Directory path
  repeated FileInfo files = 2;  // Files in directory
  uint64 request_id = 3;        // Request that produced this listing
}

// ============================================================================
// TCP Stream Messages
// ============================================================================

// TCP connection request (SYN frame payload)
message TCPOpen {
  string type = 1;            // "tcp"
  string host = 2;            // Target host
  int32 port = 3;            // Target port
}

// TCP data
message TCPData {
  bytes data = 1;             // Raw TCP data
}

// ============================================================================
// WebSocket Stream Messages
// ============================================================================

// WebSocket open request (SYN frame payload)
message WebSocketOpen {
  string type = 1;            // "websocket"
  string target = 2;          // WebSocket target URL/path
  map<string, string> headers = 3;  // WebSocket headers
}

// WebSocket message type
enum WebSocketMessageType {
  WS_TYPE_TEXT = 0;
  WS_TYPE_BINARY = 1;
}

// WebSocket message (DAT frame payload)
message WebSocketMessage {
  WebSocketMessageType message_type = 1;
  bytes data = 2;             // Message payload
}

// ============================================================================
// Shell Stream Messages
// ============================================================================

// Shell process open request (SYN frame payload).
// Environment values are intentionally not carried on the wire; the receiver
// applies its local allowlist and redaction policy.
message ShellOpen {
  string type = 1;            // "shell"
  string program = 2;         // Executable selected by the receiver policy
  repeated string args = 3;   // Direct argv values; no shell interpolation
  string cwd = 4;             // Relative working directory under the receiver root
}

// Shell input (from peer to device)
message ShellInput {
  bytes data = 1;             // Terminal input
}

// Shell output (from device to peer)
message ShellOutput {
  bytes data = 1;             // Terminal output
}

// Terminal resize. Pipe-based MVP records this frame but does not claim PTY support.
message TerminalResize {
  int32 cols = 1;            // New column count
  int32 rows = 2;            // New row count
}

// Shell process completion.
message ShellExit {
  int32 code = 1;             // Exit code, or -1 when no code is available
  bool signaled = 2;          // Whether the process was terminated by a signal
}

// Shell process error or policy rejection.
message ShellError {
  string message = 1;         // Human-readable, secret-redacted error
}

// Shell cancellation request.
message ShellCancel {
  bool requested = 1;         // Must be true for a valid cancellation frame
}

// ============================================================================
// Stream Handler Interface
// ============================================================================

// Stream context for handlers
message StreamContext {
  uint32 stream_id = 1;
  string connect_path = 2;   // Original connect path
}

// Stream handler capabilities
message StreamHandlerInfo {
  string type = 1;            // Stream type identifier
}

// ============================================================================
// Unified Stream Message Envelope
// ============================================================================

// Semantic kind of a stream message. Combined with StreamType this gives
// dispatch information without relying solely on SWSP frame flags.
enum StreamMessageKind {
  STREAM_MESSAGE_KIND_UNSPECIFIED = 0;
  STREAM_MESSAGE_KIND_OPEN = 1;       // Stream open / handshake (SYN)
  STREAM_MESSAGE_KIND_DATA = 2;       // Bulk data transfer
  STREAM_MESSAGE_KIND_CLOSE = 3;      // Graceful close (FIN)
  STREAM_MESSAGE_KIND_ERROR = 4;      // Error / policy rejection
  STREAM_MESSAGE_KIND_CANCEL = 5;     // Cancellation request
  STREAM_MESSAGE_KIND_RESIZE = 6;     // Terminal resize (shell only)
  STREAM_MESSAGE_KIND_METADATA = 7;   // Response metadata (file info, list)
}

// Unified envelope carried as the SWSP frame payload for stream_id > 0.
//
// The `payload` bytes contain the type-specific protobuf message whose
// schema is determined by the (stream_type, kind) pair:
//
//   (Shell,   OPEN)     → ShellOpen
//   (Shell,   DATA)     → ShellInput | ShellOutput (direction depends on role)
//   (Shell,   RESIZE)   → TerminalResize
//   (Shell,   CLOSE)    → ShellExit
//   (Shell,   ERROR)    → ShellError
//   (Shell,   CANCEL)   → ShellCancel
//   (File,    OPEN)     → FileOp
//   (File,    DATA)     → raw bytes
//   (File,    METADATA) → FileInfo | FileList
//   (File,    ERROR)    → ShellError (reused)
//   (Http,    OPEN)     → HTTPRequest
//   (Http,    DATA)     → HTTPData
//   (Http,    METADATA) → HTTPResponse
//   (Tcp,     OPEN)     → TCPOpen
//   (Tcp,     DATA)     → TCPData
//   (WebSocket, OPEN)   → WebSocketOpen
//   (WebSocket, DATA)   → WebSocketMessage
//
// Existing handlers may continue using raw SWSP frames without wrapping
// them in StreamMessage. The envelope is opt-in for new code that benefits
// from type-safe dispatch.
message StreamMessage {
  StreamType stream_type = 1;         // Which stream this message belongs to
  StreamMessageKind kind = 2;         // Semantic action
  uint32 sequence = 3;                // Monotonic sequence within the stream
  bytes payload = 10;                 // Type-specific protobuf (decoded per table above)
}
