[package]
name = "blnk"
version = "0.1.0"
edition = "2024"
authors = ["Dollawatt Chidjai"]
description = "Remote access multitool in Rust"
license = "MIT"
readme = "README.md"
homepage = "https://github.com/bl1nk-bot/blnk"
repository = "https://github.com/bl1nk-bot/blnk"

[lib]
name = "blnk"
path = "src/lib.rs"

[[bin]]
name = "blnk"
path = "src/main.rs"

[dependencies]
# Core
tokio = { version = "1.53.1", features = ["full"] }
tokio-util = "0.7.19"
futures = "0.3.33"
async-trait = "0.1.91"           # Type erasure for async trait methods
async-channel = "2.5.0"
async-broadcast = "0.7.2"
event-listener = "5.4.1"
prost = "0.14.4"
prost-types = "0.14.4"
prost-derive = "0.14.4"

# For WebSocket support
tokio-tungstenite = "0.30.0"
webrtc = "0.20.0"

# Networking
axum = "0.8.9"
tungstenite = "0.30.0"
reqwest = { version = "0.13.4", features = ["json"] }
hyper = "1.11.0"
http = "1.5.0"

# System
[target.'cfg(unix)'.dependencies]
nix = { version = "0.31.3", default-features = false, features = ["term", "fs", "process", "signal"] }

# CLI & Config
clap = { version = "4.0", features = ["derive"] }
config = "0.15.25"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Utilities
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2.0.19"
anyhow = "1.0"
uuid = { version = "1.0", features = ["v4"] }
qrcode = "0.14.1"
mdns = "3.0.0"
url = "2.0"
getrandom = "0.3"

[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", default-features = false, features = ["winuser", "winbase", "processthreadsapi"] }

[dev-dependencies]
tokio-test = "0.4"
mockall = "0.11"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[profile.release-with-debug]
inherits = "release"
debug = true
strip = false
